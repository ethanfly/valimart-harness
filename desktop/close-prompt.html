<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>关闭窗口</title>
<style>
  :root {
    --bg: #f6f4ef;
    --card: #fffcf7;
    --ink: #1b1b1f;
    --muted: #5c5a56;
    --line: #e6e0d6;
    --accent: #3d4fd8;
    --accent-ink: #fff;
    --danger: #9a2f32;
    --shadow: 0 18px 40px rgba(40, 32, 18, 0.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; }
  body {
    font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Songti SC', 'SimSun', serif;
    color: var(--ink);
    overflow: hidden;
  }
  .sheet {
    height: 100%;
    background:
      radial-gradient(1200px 280px at 10% -20%, rgba(61, 79, 216, 0.08), transparent 55%),
      linear-gradient(180deg, var(--card), var(--bg));
    border: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    padding: 22px 22px 16px;
  }
  .mark {
    width: 28px;
    height: 28px;
    background: var(--ink);
    -webkit-mask: url(build/valimart-mark.png) center / contain no-repeat;
    mask: url(build/valimart-mark.png) center / contain no-repeat;
  }
  h1 {
    margin: 16px 0 8px;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  p {
    margin: 0;
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    font-size: 13px;
    line-height: 1.65;
    color: var(--muted);
  }
  .grow { flex: 1; }
  label.remember {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 16px 0 14px;
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    font-size: 12.5px;
    color: var(--muted);
    user-select: none;
    cursor: pointer;
  }
  label.remember input { accent-color: var(--accent); }
  .actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
  button {
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    font-size: 13px;
    height: 34px;
    padding: 0 14px;
    border-radius: 8px;
    border: 1px solid transparent;
    cursor: pointer;
  }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ghost { background: transparent; color: var(--muted); }
  .ghost:hover { background: rgba(0,0,0,.04); color: var(--ink); }
  .exit { background: #fff; border-color: var(--line); color: var(--danger); }
  .exit:hover { background: #f8eeee; }
  .go { background: var(--accent); color: var(--accent-ink); box-shadow: var(--shadow); }
  .go:hover { filter: brightness(1.06); }
</style>
</head>
<body>
  <div class="sheet">
    <div class="mark" role="img" aria-label="VALIMART"></div>
    <h1>关闭窗口</h1>
    <p>后台运行时工作台继续连着网关，可从托盘图标重新打开。</p>
    <div class="grow"></div>
    <label class="remember"><input id="remember" type="checkbox"> 记住我的选择</label>
    <div class="actions">
      <button type="button" class="ghost" data-act="cancel">取消</button>
      <button type="button" class="exit" data-act="quit">退出</button>
      <button type="button" class="go" data-act="minimize" autofocus>后台运行</button>
    </div>
  </div>
  <script>
    const remember = () => document.getElementById('remember').checked
    const pick = (action) => window.closePrompt.choose(action, remember())
    for (const btn of document.querySelectorAll('button[data-act]')) {
      btn.addEventListener('click', () => pick(btn.dataset.act))
    }
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        e.preventDefault()
        pick('cancel')
        return
      }
      // 焦点在按钮上时 Enter 交给按钮原生 click（否则先触发 minimize、后触发 quit/cancel，「退出」对键盘不可达）
      if (e.key === 'Enter' && !(e.target instanceof HTMLButtonElement)) {
        e.preventDefault()
        pick('minimize')
      }
    })
  </script>
</body>
</html>
