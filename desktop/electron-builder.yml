appId: team.ethan.valimart-harness
productName: valimart harness
copyright: Valimart
directories:
  output: ../dist
  buildResources: build
files:
  - main.js
  - preload.js
  - dsh-web-url.cjs
  - prefs.cjs
  - image-menu.cjs
  - window-drag.cjs
  - splash.html
  - close-prompt.html
  - close-prompt-preload.js
  - build/icon.png
  - build/valimart-wordmark.png
  - build/valimart-mark.png
  - package.json
extraResources:
  - from: ../build/payload
    to: payload
asar: true
compression: normal
npmRebuild: false
win:
  target:
    - nsis
  icon: build/icon.ico
  artifactName: valimart-harness-Setup-${version}.${ext}
nsis:
  include: build/installer.nsh
  oneClick: true
  perMachine: false
  allowElevation: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: valimart harness
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  language: "2052"
