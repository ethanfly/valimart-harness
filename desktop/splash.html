<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>valimart harness</title>
<style>
  html, body { margin: 0; height: 100%; background: #ffffff; color: #1b1b1f; font-family: -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif; user-select: none; -webkit-app-region: drag; }
  .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
  .logo { width: 260px; height: 52px; background: #1b1b1f; -webkit-mask: url(build/valimart-wordmark.png) center / contain no-repeat; mask: url(build/valimart-wordmark.png) center / contain no-repeat; }
  .product { font-size: 11px; letter-spacing: 0.32em; color: #8a8a93; font-weight: 600; }
  .tag { font-size: 12px; color: #56565c; }
  .status { margin-top: 18px; font-size: 12px; color: #56565c; display: flex; align-items: center; gap: 8px; max-width: 360px; text-align: center; }
  .spin { width: 12px; height: 12px; border: 2px solid #e4e4e7; border-top-color: #1b1b1f; border-radius: 50%; animation: r 0.9s linear infinite; flex: none; }
  @keyframes r { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo" role="img" aria-label="VALIMART"></div>
  <div class="product">harness</div>
  <div class="tag">企业交付工作台</div>
  <div class="status"><span class="spin"></span><span id="s">正在启动…</span></div>
</div>
<script>
  window.__setStatus = (t) => { document.getElementById('s').textContent = t }
</script>
</body>
</html>
