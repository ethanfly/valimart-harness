# THE DIVA · 企业交付工作台 —— dsh "desk" profile 的用户补丁层
# 在 @deepseek-ai/dsh-base + @deepseek-ai/dsh-web-app 两个 bundle 之上：
#   1) 关掉官方外壳（布局/侧栏/品牌）与员工不该碰的模型密钥页；插件列表保持与 DeepSeek Harness 兼容；
#   2) 插入公司插件：desk-host（网关登录、模型路由、公司盘、任务工具）与 desk-ui（THE DIVA 外壳）；
#   3) 默认权限预设改为“完全访问”（公司电脑上的交付进程不逐条审批）。
# 安装脚本 scripts/setup-profile.mjs 会把本文件复制到 $DSH_HOME/profiles/desk/cordis.patch.yml。

- id: ui-layout
  disabled: true
- id: ui-sidebar
  disabled: true
- id: ui-brand-official
  disabled: true
- id: ui-settings-models
  disabled: true

# 官方 DeepSeek 直连适配器关掉：公司电脑上所有模型请求只走公司网关（按人记账、密钥不落本机），
# 模型菜单里只剩公司网关分发的模型，按上游厂商分组（DeepSeek / Grok / …，路由 id = desk-gateway-<厂商>）。
- id: llm-deepseek
  disabled: true

# 组合层的默认模型也指向公司网关（desk-host 登录后会按公司配置的 defaultModel 再写一次用户设置）
- id: agent-default-model
  config:
    provider: desk-gateway-deepseek
    model: deepseek-v4-pro

# 会话自动标题走当前会话的模型路由（即公司网关）。官方默认只给 64 个输出 token，
# 带思维链的模型（deepseek-v4-pro 等）思考就把额度用完，标题永远停在「首句截断」的兜底；放宽到 2048。
- id: session-title-llm
  config:
    targetWords: 5
    targetCjkCharacters: 10
    maxInputBytes: 4096
    maxOutputTokens: 2048
    timeoutMs: 60000

- id: permission
  config:
    defaultPreset: danger-full-access
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never

# 第三方插件：@anweat/dsh-browser（随内核前缀离线分发）。公司机器用系统 Edge 当浏览器通道，
# 不下载 Playwright Chromium；关掉 OpenCLI（省一份 ~13MB 依赖）。browser_* 工具默认仍需审批，
# 但公司 profile 的默认权限预设是 danger-full-access / approval: never。
- id: browser
  config:
    channel: msedge
    browserRuntime: playwright
    opencliEnabled: false

# 第三方插件：@anysearch/anysearch-dsh（随内核前缀离线分发，官方接 DSH 的方式）。
# 它自带的 bundle 层已把 ctx.web 的 searchProvider/fetchProvider 固定为 anysearch（接管原生
# web_search/web_fetch）。这里按 AnySearch 官方文档在用户层显式覆盖 web-search-anysearch 条目：
# id 保持不变、完整替换 config，不要另起 id 加第二个 Provider。
# 无 Key 走匿名额度；Key 写 $DSH_HOME/.credentials.yaml 的 ANYSEARCH_API_KEY（不落仓库），
# 插件每次请求动态解析，换 Key 不用重启。
- id: web-search-anysearch
  config:
    apiKeyEnv: ANYSEARCH_API_KEY
    baseURL: https://api.anysearch.com
    maxRenderedContentChars: 12000

- insert:
    - id: desk-host
      name: '@company-desk/desk-host'
      config:
        gatewayUrl: 'http://127.0.0.1:8790'
        providerId: desk-gateway
        providerName: 'valimart harness 公司网关'
    - id: desk-ui
      name: '@company-desk/desk-ui'
